<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .gate-container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.45s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(1.04);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 2.2rem;
            color: #FFFFFF;
        }

        .profiles-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 0;
            row-gap: 1.8rem;
        }

        .profile-card {
            text-decoration: none;
            color: #808080;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 155px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .avatar-box {
            width: 120px;
            height: 120px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 3px solid transparent;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .team-ferrari {
            background-color: #e80020;
        }

        .team-mclaren {
            background-color: #ff8000;
        }

        .team-mercedes {
            background-color: #00f5d0;
        }

        .team-williams {
            background-color: #0047cc;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .profile-card:hover .avatar-box {
            border-color: #FFFFFF;
            transform: scale(1.03);
        }

        .profile-card:hover .driver-name {
            color: #FFFFFF;
        }

        .driver-name {
            margin-top: 0.75rem;
            font-size: 1.05rem;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        @media (max-width: 600px) {
            .profile-card {
                width: 125px;
            }

            .avatar-box {
                width: 125px;
                height: 125px;
            }

            .profiles-row {
                gap: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <main class="gate-container">
        <h1>Select Your Driver</h1>

        <div class="profiles-row">
            <!--Ferrari-->
            <a href="self-profile/travelicia.html" class="profile-card">
                <div class="avatar-box team-ferrari">
                    <img src="assets-index/Ferrari.png" alt="Ferrari">
                </div>
                <span class="driver-name">Travelicia</span>
            </a>

            <!--McLaren-->
            <a href="self-profile/kayprofil.html" class="profile-card">
                <div class="avatar-box team-mclaren">
                    <img src="assets-index/McLaren.png" alt="McLaren">
                </div>
                <span class="driver-name">Kaylene</span>
            </a>

            <!--Mercedes-->
            <a href="self-profile/sheryl.html" class="profile-card">
                <div class="avatar-box team-mercedes">
                    <img src="assets-index/Mercedes.png" alt="Mercedes">
                </div>
                <span class="driver-name">Sheryl</span>
            </a>

            <!--Williams-->
            <a href="self-profile/Nona.html" class="profile-card">
                <div class="avatar-box team-williams">
                    <img src="assets-index/Williams.png" alt="Williams">
                </div>
                <span class="driver-name">Nona</span>
            </a>
        </div>
    </main>
</body>

</html>
