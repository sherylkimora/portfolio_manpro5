<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheryl — Super Team</title>
    <style>
        :root {
            --teal: #00d2be;
            --bg: #0b0d10;
            --panel: #14181d;
            --text: #e6e9ee;
            --muted: #7d8590;
            --line: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Titillium Web", "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 24px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .back {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .back:hover {
            color: var(--teal);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 32px 0 40px;
        }

        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--teal);
            background: var(--panel);
            display: block;
        }

        .pit-board {
            position: absolute;
            right: -14px;
            bottom: -6px;
            font-family: monospace;
            font-size: 0.6rem;
            letter-spacing: 0.05em;
            background: var(--panel);
            color: var(--teal);
            border: 1px solid rgba(0, 210, 190, 0.4);
            border-radius: 4px;
            padding: 2px 5px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--teal);
            margin-bottom: 12px;
        }

        .block {
            margin-bottom: 36px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .chip.tech {
            font-family: monospace;
            color: var(--teal);
            border-color: rgba(0, 210, 190, 0.35);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back">← Back to list</a>

        <header class="header">
            <div class="avatar-wrap">
                <img class="avatar" src="assets/sheryl.jpg" alt="Sheryl">
                <span class="pit-board">12 · 63</span>
            </div>
            <div>
                <h1>Sheryl Kimora</h1>
            </div>
        </header>

        <div class="block">
            <p class="label">Hobbies</p>
            <div class="chips">
                <span class="chip">Watching movies</span>
                <span class="chip">Eating</span>
            </div>
        </div>

        <div class="block">
            <p class="label">Skills</p>
            <div class="chips">
                <span class="chip tech">Java</span>
                <span class="chip tech">HTML</span>
            </div>
        </div>
    </div>
</body>

</html>
